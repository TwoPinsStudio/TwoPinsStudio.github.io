<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rarissimo</title>
<meta name="description" content="A party game for 2 to 4 teams around one phone. The rarest answer wins. No ads, no tracking.">
<link rel="icon" href="../logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@400;600;700&display=swap">
<link rel="stylesheet" href="rarissimo.css">
</head>
<body>
<div class="wrap">
  <header>
    <a href="../">← Two Pins Studio</a>
    <select class="lang" aria-label="Language"></select>
  </header>

  <h1>Rarissimo</h1>
  <p class="tagline" data-i18n="rr_tagline">The rarest wins.</p>
  <p class="lead" data-i18n="rr_pitch"></p>
  <p class="lead" data-i18n="rr_pitch2"></p>
  <p class="note" data-i18n="rr_lang_note"></p>
  <div class="stores">
    <div class="store">App Store<b data-i18n="soon">Coming soon</b></div>
    <div class="store">Google Play<b data-i18n="soon">Coming soon</b></div>
  </div>

  <section>
    <h2 data-i18n="shots">Screenshots</h2>
    <div class="shots">
      <img src="shots/menu.jpg" alt="Menu" loading="lazy">
      <img src="shots/setup.jpg" alt="Game setup" loading="lazy">
      <img src="shots/round.jpg" alt="A round" loading="lazy">
      <img src="shots/results.jpg" alt="Round results" loading="lazy">
    </div>
  </section>

  <section>
    <h2 data-i18n="howto">How to play</h2>
    <div class="rows rules">
      <div><h3 data-i18n="rr_think"></h3><p data-i18n="rr_thinkD"></p></div>
      <div><h3 data-i18n="rr_reveal"></h3><p data-i18n="rr_revealD"></p></div>
      <div><h3 data-i18n="rr_score"></h3><p data-i18n="rr_scoreD"></p></div>
    </div>
    <h3 style="margin-top:28px" data-i18n="rr_points"></h3>
    <div class="tiers">
      <span style="background:#18D6FF" data-i18n="rr_easy"></span>
      <span style="background:#7DFF4F" data-i18n="rr_medium"></span>
      <span style="background:#FF8A00" data-i18n="rr_rare"></span>
      <span style="background:#FFE600" data-i18n="rr_legend"></span>
    </div>
    <div class="rows" style="margin-top:28px">
      <div><h3 data-i18n="rr_dup"></h3><p data-i18n="rr_dupD"></p></div>
      <div><h3 data-i18n="rr_final"></h3><p data-i18n="rr_finalD"></p></div>
      <div><h3 data-i18n="rr_setup"></h3><p data-i18n="rr_setupD"></p></div>
    </div>
  </section>

  <section>
    <div class="why">
      <h2 data-i18n="free_title"></h2>
      <p data-i18n="rr_free"></p>
      <p data-i18n="support_text"></p>
      <a class="btn" href="https://ko-fi.com/twopinsstudio" target="_blank" rel="noopener" data-i18n="coffee">Buy me a coffee</a>
    </div>
  </section>

  <section>
    <h2 data-i18n="credits">Credits</h2>
    <dl>
      <dt data-i18n="cr_made"></dt><dd>Jeff · Two Pins Studio</dd>
      <dt data-i18n="cr_tech"></dt><dd>Flutter &amp; Firebase</dd>
    </dl>
  </section>

  <section>
    <h2 data-i18n="contact">Contact</h2>
    <p><a class="mail" href="mailto:two.pins.tech@gmail.com">two.pins.tech@gmail.com</a></p>
  </section>

  <footer>
    <a href="privacy.html" data-i18n="privacy">Privacy policy</a>
    <a href="support.html" data-i18n="support">Support</a>
    <a href="../">Two Pins Studio</a>
  </footer>
</div>
<script src="../i18n.js"></script>
</body>
</html>
