<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pal &amp; Pit</title>
<meta name="description" content="A face-to-face race for two players on one phone or tablet. No ads, no tracking.">
<link rel="icon" href="../logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@400;600;800&display=swap">
<link rel="stylesheet" href="palpit.css">
</head>
<body>
<div class="wrap">
  <header>
    <a href="../">← Two Pins Studio</a>
    <select class="lang" aria-label="Language"></select>
  </header>

  <h1><span class="pal">Pal</span> <span class="amp">&amp;</span> <span class="pit">Pit</span></h1>
  <svg class="pulse" viewBox="0 0 900 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30H330l14-22 16 44 14-36 10 14H560l14-22 16 44 14-36 10 14H900"/></svg>
  <p class="tagline" data-i18n="tagline"></p>
  <p class="lead" data-i18n="pitch"></p>
  <p class="lead" data-i18n="pitch2"></p>
  <div class="stores">
    <div class="store">App Store<b data-i18n="soon">Coming soon</b></div>
    <div class="store">Google Play<b data-i18n="soon">Coming soon</b></div>
  </div>

  <section>
    <h2 data-i18n="shots">Screenshots</h2>
    <div class="shots">
      <img src="shots/menu.jpg" alt="Menu" loading="lazy">
      <img src="shots/gate.jpg" alt="The gate" loading="lazy">
      <img src="shots/hearts.jpg" alt="Program signatures" loading="lazy">
      <img src="shots/obstacle.jpg" alt="An obstacle" loading="lazy">
      <img src="shots/alarm.jpg" alt="Program you are not allowed" loading="lazy">
      <img src="shots/boost.jpg" alt="Administrator resources" loading="lazy">

  <section>
    <h2 data-i18n="story_title">The story</h2>
    <p data-i18n="story"></p>
  </section>

    <p class="muted" data-i18n="goal1"></p>

    <h3 style="margin-top:28px" data-i18n="controls"></h3>
    <div class="rows controls">
      <div><h3 data-i18n="flip"></h3><p data-i18n="flipD"></p></div>
      <div><h3 data-i18n="jump"></h3><p data-i18n="jumpD"></p></div>
      <div><h3 data-i18n="fire"></h3><p data-i18n="fireD"></p></div>
    </div>
    <h3 style="margin-top:28px" data-i18n="boosts"></h3>
    <p class="muted" data-i18n="boostsD"></p>
    <div class="rows">
      <div><h3 data-i18n="b_multiplier"></h3><p data-i18n="b_multiplierD"></p></div>
      <div><h3 data-i18n="b_magnet"></h3><p data-i18n="b_magnetD"></p></div>
      <div><h3 data-i18n="b_shield"></h3><p data-i18n="b_shieldD"></p></div>
      <div><h3 data-i18n="b_lightning"></h3><p data-i18n="b_lightningD"></p></div>
      <div><h3 data-i18n="b_freeze"></h3><p data-i18n="b_freezeD"></p></div>
      <div><h3 data-i18n="b_invert"></h3><p data-i18n="b_invertD"></p></div>
      <div><h3 data-i18n="b_flatline"></h3><p data-i18n="b_flatlineD"></p></div>
    </div>
    <h3 style="margin-top:28px" data-i18n="modes"></h3>
    <div class="rows controls">
      <div><h3 data-i18n="race"></h3><p data-i18n="raceD"></p></div>
      <div><h3 data-i18n="solo"></h3><p data-i18n="soloD"></p></div>
    </div>
  </section>

  <section>
    <div class="why">
      <h2 data-i18n="why_title">Why I made it</h2>
      <p data-i18n="why1"></p>
      <p data-i18n="why2"></p>
      <h2 style="margin-top:28px" data-i18n="free_title"></h2>
      <p data-i18n="free"></p>
      <p data-i18n="support_text"></p>
      <a class="btn" href="https://ko-fi.com/twopinsstudio" target="_blank" rel="noopener" data-i18n="coffee">Buy me a coffee</a>
    </div>

  <section>
    <h2 data-i18n="credits">Credits</h2>
    <dl>
      <dt data-i18n="cr_made"></dt><dd>Jeff · Two Pins Studio</dd>
      <dt data-i18n="cr_game"></dt><dd>Lub vs Dub</dd>
      <dt data-i18n="cr_vis"></dt><dd>TRON: Legacy</dd>
      <dt data-i18n="cr_tech"></dt><dd>Flutter &amp; Flame</dd>
    </dl>

  <section>

    <p><a class="mail" href="mailto:two.pins.tech@gmail.com">two.pins.tech@gmail.com</a></p>

  <footer>
    <a href="privacy.html" data-i18n="privacy">Privacy policy</a>

    <a href="../">Two Pins Studio</a>
